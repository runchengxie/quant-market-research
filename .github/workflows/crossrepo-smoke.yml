name: Synthetic cross-repository integration

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/test_synthetic_chain.py"
      - "tests/test_crossrepo_candidates.py"
      - "tests/test_locked_providers.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/crossrepo-smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/test_synthetic_chain.py"
      - "tests/test_crossrepo_candidates.py"
      - "tests/test_locked_providers.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/crossrepo-smoke.yml"
  workflow_dispatch:
    inputs:
      candidates:
        description: 'Optional JSON mapping data/runtime/platform/quality to complete commit SHA'
        type: string
        default: '{}'

permissions:
  contents: read

concurrency:
  group: crossrepo-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the checked-out consumer and workflow event
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          receipt = {
              "schema_version": 1,
              "consumer_revision": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True).strip(),
              "workflow": {key: os.environ.get(key) for key in (
                  "GITHUB_EVENT_NAME", "GITHUB_REPOSITORY", "GITHUB_REF", "GITHUB_SHA",
                  "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_WORKFLOW_REF",
                  "GITHUB_WORKFLOW_SHA")},
          }
          if "pull_request" in event:
              pr = event["pull_request"]
              receipt["pull_request"] = {
                  "number": event["number"],
                  **{side: {"sha": pr[side]["sha"], "ref": pr[side]["ref"],
                            "repository": pr[side]["repo"]["full_name"]}
                     for side in ("base", "head")},
              }
          destination = Path(os.environ["RUNNER_TEMP"]) / "workflow-provenance.json"
          destination.write_text(json.dumps(receipt, indent=2) + "\n")
          PYTHON
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true
      - name: Validate the PR manifest and committed provider sources before installation
        run: python src/market_research/locked_providers.py --output "$RUNNER_TEMP/locked-providers.json" --receipt "$RUNNER_TEMP/provider-selection.json"
      - name: Install the complete pinned integration environment
        run: uv sync --locked --extra dev --extra duckdb --extra formal --extra integration
      - name: Verify the real synthetic chain without dependency skips
        env:
          REQUIRE_CROSSREPO_SMOKE: "1"
        run: uv run --locked --extra dev --extra duckdb --extra formal --extra integration pytest -q --junitxml="$RUNNER_TEMP/crossrepo-tests.xml" tests/test_synthetic_chain.py tests/test_crossrepo_candidates.py tests/test_locked_providers.py
      - name: Produce a versioned synthetic acceptance receipt
        run: uv run --locked --extra formal --extra integration market-research-synthetic-chain --output "$RUNNER_TEMP/research-chain" --expected-providers "$RUNNER_TEMP/locked-providers.json"
      - name: Verify the exact PR lock or explicit manual candidates in a disposable environment
        env:
          CANDIDATES: ${{ inputs.candidates || '' }}
        run: .venv/bin/python -m market_research.crossrepo_acceptance --output "$RUNNER_TEMP/crossrepo-acceptance" --candidates "$CANDIDATES"
      - name: Retain acceptance evidence and command failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crossrepo-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/workflow-provenance.json
            ${{ runner.temp }}/crossrepo-tests.xml
            ${{ runner.temp }}/provider-selection.json
            ${{ runner.temp }}/locked-providers.json
            ${{ runner.temp }}/research-chain
            ${{ runner.temp }}/crossrepo-acceptance
          if-no-files-found: error
