site_name: Quant Market Research
site_url: https://runchengxie.github.io/quant-market-research/docs/
docs_dir: docs
site_dir: web/dist/docs
use_directory_urls: true
strict: true
theme:
  name: mkdocs
  custom_dir: docs/overrides
  locale: en
  features:
    - navigation.top

# The repository's internal runbooks include local-only paths and operational
# details. Only reviewed public research notes are included in GitHub Pages.
exclude_docs: |
  **
  !/index.md
  !/index.zh-CN.md
  !/research-closeout-status.md
  !/research-closeout-status.zh-CN.md
  !/research/factors/low-turnover.md
  !/research/factors/low-turnover.zh-CN.md
  !/research/factors/pb-roe.md
  !/research/factors/pb-roe.zh-CN.md
  !/research/factors/microcap.md
  !/research/factors/microcap.zh-CN.md
  !/research/experiments/microcap-execution-diagnostic-20260928.md
  !/research/experiments/microcap-execution-diagnostic-20260928.zh-CN.md
  !/research/factors/smallcap-turnover-history.md
  !/research/factors/smallcap-turnover-history.zh-CN.md
  !/research/factors/barra-factor-dictionary.md
  !/research/factors/barra-factor-dictionary.zh-CN.md
  !/research/factors/barra-source-inventory.md
  !/research/factors/barra-source-inventory.zh-CN.md
  !/css/**
  !/js/**
  !/img/**
  !/webfonts/**
  !/search/**
  !/assets/theme-tokens.css
  !/assets/docs.css

nav:
  - Research overview: index.md
  - Factor research:
      - Research closeout status: research-closeout-status.md
      - PB and ROE: research/factors/pb-roe.md
      - Low turnover: research/factors/low-turnover.md
      - Microcap: research/factors/microcap.md
      - Microcap execution diagnostic: research/experiments/microcap-execution-diagnostic-20260928.md
      - Small-cap turnover history: research/factors/smallcap-turnover-history.md
      - Barra factor dictionary: research/factors/barra-factor-dictionary.md
      - Barra source inventory: research/factors/barra-source-inventory.md
extra:
  public_site_url: https://runchengxie.github.io/quant-market-research/

extra_css:
  - assets/theme-tokens.css
  - assets/docs.css

markdown_extensions:
  - toc:
      permalink: true
  - tables
