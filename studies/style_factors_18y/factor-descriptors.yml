schema_version: 1
study_id: style_factors_18y
status: exploratory
description: >-
  18 年 A 股风格研究当前实现的机器可读因子字典。该文件描述研究用
  descriptor、风格因子和报告层 family，不声称复刻商业 Barra 模型。

families:
  size:
    factors:
      - id: size
        name_zh: 规模
        direction: low_minus_high
        descriptors:
          - id: log_market_cap
            source: daily_basic.total_mv
            transform: log
            pit: formation_date_available
        caveats:
          - 使用公开快照中的总市值口径，未等同于完整 Barra 市值模型。

  value:
    factors:
      - id: book_to_price
        name_zh: 账面市值比
        direction: high_minus_low
        descriptors:
          - id: book_to_price
            source: daily_basic.pb
            transform: inverse
            pit: formation_date_available
        caveats:
          - PB 为零或缺失时无法生成该 descriptor。
      - id: earnings_yield
        name_zh: 盈利收益率
        direction: high_minus_low
        descriptors:
          - id: earnings_yield
            source: daily_basic.pe_ttm
            transform: inverse_positive_only
            pit: formation_date_available
        caveats:
          - 当前实现只保留 PE_TTM 大于零的股票，亏损公司不在该 descriptor 样本内。

  momentum:
    factors:
      - id: short_term_momentum_21d
        name_zh: 短期动量（21 日）
        direction: high_minus_low
        descriptors:
          - id: return_21d_excluding_formation
            source: daily.close
            transform: pct_change_21d_shift_1
            pit: formation_date_available
        caveats:
          - 21 日窗口更接近短期反转或短期动量代理，不应直接称为标准中期 Barra 动量。

  volatility:
    factors:
      - id: total_volatility_21d
        name_zh: 总波动率（21 日）
        direction: low_minus_high
        descriptors:
          - id: realized_volatility_21d
            source: daily.close
            transform: rolling_std_21d
            pit: formation_date_available
        caveats:
          - 当前实现是总收益波动率，尚未剥离市场和行业波动。

  liquidity:
    factors:
      - id: turnover_1d
        name_zh: 单日换手率
        direction: low_minus_high
        descriptors:
          - id: turnover_rate
            source: daily.turnover_rate
            transform: raw
            pit: formation_date_available
      - id: turnover_20d
        name_zh: 20 日平均换手率
        direction: low_minus_high
        descriptors:
          - id: turnover_rate_20d
            source: daily.turnover_rate
            transform: mean_20d_shift_1
            pit: formation_date_available
      - id: turnover_60d
        name_zh: 60 日平均换手率
        direction: low_minus_high
        descriptors:
          - id: turnover_rate_60d
            source: daily.turnover_rate
            transform: mean_60d_shift_1
            pit: formation_date_available
      - id: amihud_20d
        name_zh: Amihud 非流动性（20 日）
        direction: low_minus_high
        descriptors:
          - id: amihud_20d
            source: daily.return_and_amount
            transform: mean(abs(return) / amount)_20d_shift_1
            pit: formation_date_available
        caveats:
          - 该指标同时混合价格波动、信息冲击和成交额单位，属于非流动性代理变量。

  quality:
    factors:
      - id: profitability
        name_zh: 盈利能力
        direction: high_minus_low
        descriptors:
          - id: roe
            source: fundamental.roe
            transform: winsorize_1_99_then_zscore
            pit: source_specific
          - id: roa
            source: fundamental.roa
            transform: sensitivity_only
            pit: source_specific
        caveats:
          - 当前主复合质量实现使用 ROE，ROA 作为待验证敏感性版本。
      - id: leverage
        name_zh: 杠杆
        direction: low_minus_high
        descriptors:
          - id: debt_to_assets
            source: fundamental.debt_to_assets
            transform: winsorize_1_99_then_zscore
            pit: source_specific
      - id: earnings_quality
        name_zh: 盈利质量
        direction: high_minus_low
        descriptors:
          - id: ocf_to_net_income
            source: fundamental.operating_cashflow_and_netprofit
            transform: ratio_then_winsorize_1_99_then_zscore
            pit: source_specific
      - id: earnings_variability
        name_zh: 盈利稳定性
        direction: low_minus_high
        descriptors:
          - id: netprofit_yoy_volatility_8q
            source: fundamental.netprofit_yoy
            transform: rolling_std_8q_then_negative
            pit: source_specific
    composites:
      - id: quality
        name_zh: 复合质量
        components:
          - profitability
          - leverage
          - earnings_quality
          - earnings_variability
        weighting: equal
        caveats:
          - 归因回归时应在复合质量和其子因子之间二选一，避免重复计入杠杆。
