[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-research"
version = "0.1.0"
description = "Cross-market equity research, liquidity, capacity, and index replication framework"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15.20,<0.16"]
duckdb = ["duckdb>=1.1"]
formal = [
    "quant-backtest-runtime @ git+https://github.com/runchengxie/quant-backtest-runtime.git@c0dafefa2539fd3e0023daef9fd0fd8385c183c9 ; python_version >= '3.12'",
    "quant-platform @ git+https://github.com/runchengxie/quant-platform.git@70073b9e3566125f00b74d094b9d5a9f08e51c49 ; python_version >= '3.12'",
    "research-contracts @ git+https://github.com/runchengxie/quant-platform.git@70073b9e3566125f00b74d094b9d5a9f08e51c49#subdirectory=packages/research-contracts ; python_version >= '3.12'",
]
yahoo = ["yfinance>=1.0"]
docs = ["mkdocs>=1.6,<2"]

[project.scripts]
market-research = "market_research.cli:main"
microcap-execution-diagnostic = "market_research.microcap_execution:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
