[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-research"
version = "0.1.0"
description = "Cross-market equity research, liquidity, capacity, and index replication framework"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15.20,<0.16"]
duckdb = ["duckdb>=1.1"]
integration = [
    "quant-market-data-platform @ git+https://github.com/runchengxie/quant-market-data-platform.git@71e40a0da03530fe88d70d4b212701d3af6a8cfa",
]
formal = [
    "quant-backtest-runtime @ git+https://github.com/runchengxie/quant-backtest-runtime.git@4fbfe973540e15fb6552068be037229d2f53d540 ; python_version >= '3.12'",
    "quant-platform @ git+https://github.com/runchengxie/quant-platform.git@15ec62b66e894395d694049eaaace931de4a1265 ; python_version >= '3.12'",
    "research-contracts @ git+https://github.com/runchengxie/quant-platform.git@15ec62b66e894395d694049eaaace931de4a1265#subdirectory=packages/research-contracts ; python_version >= '3.12'",
]
yahoo = ["yfinance>=1.0"]
dividends = ["requests>=2.32", "openpyxl>=3.1"]

[project.scripts]
market-research = "market_research.cli:main"
microcap-execution-diagnostic = "market_research.microcap_execution:main"
market-research-synthetic-chain = "market_research.synthetic_chain:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.uv]
# Keep the formal provider and contracts on the reviewed packaging revision.
override-dependencies = [
    "quant-platform @ git+https://github.com/runchengxie/quant-platform.git@15ec62b66e894395d694049eaaace931de4a1265 ; python_version >= '3.12'",
]
